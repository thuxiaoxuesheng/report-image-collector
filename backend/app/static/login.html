<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · 小红书图片采集器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f3ef;
      color: #24211d;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      width: min(420px, calc(100% - 32px));
      background: #fff;
      padding: 34px;
      border: 1px solid #e6e0d8;
      border-radius: 20px;
      box-shadow: 0 18px 50px #4f45351a;
    }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { color: #716b62; margin: 0 0 24px; }
    label { display: block; font-size: 14px; margin: 16px 0 7px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cec7bd;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #d94b45;
      color: #fff;
      font-size: 16px;
      font-weight: 650;
      cursor: pointer;
    }
    .error {
      color: #b42318;
      background: #fef3f2;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>小红书图片采集器</h1>
    <p>请输入网站访问账号</p>
    <!--ERROR-->
    <form method="post" action="/site-login?csrf=<!--CSRF-->">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">登录</button>
    </form>
  </main>
</body>
</html>
